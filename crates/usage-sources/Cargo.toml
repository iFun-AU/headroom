[package]
name = "usage-sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
claude-oauth = []

[dependencies]
dirs = "7.0.0"
notify = "8.2.0"
thiserror = "2.0.17"
tokio = { version = "1.53.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tracing = "0.1.41"
usage-core = { path = "../usage-core" }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.53.0", features = ["test-util"] }

[lints]
workspace = true
