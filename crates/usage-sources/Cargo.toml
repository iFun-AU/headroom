[package]
name = "usage-sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
claude-oauth = []

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
dirs = "7.0.0"
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.53.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tracing = "0.1.41"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings", "serde-compat"] }
usage-core = { path = "../usage-core" }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.53.0", features = ["test-util"] }

[lints]
workspace = true
