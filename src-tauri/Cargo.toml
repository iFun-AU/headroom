[package]
name = "how-is-it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Claude and Codex plan usage at a glance"

[lib]
name = "how_is_it"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "macos-private-api", "image-png"] }

[lints]
workspace = true
