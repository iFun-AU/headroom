[package]
name = "how-is-it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Claude and Codex plan usage at a glance"

[lib]
name = "how_is_it"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-liquid-glass = "0.1.6"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-positioner = { version = "2.3.4", features = ["tray-icon"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.53.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tracing = "0.1.41"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings", "serde-compat"] }
usage-core = { version = "1.0.0", path = "../crates/usage-core" }
usage-sources = { version = "1.0.0", path = "../crates/usage-sources" }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.0", features = ["test-util"] }
